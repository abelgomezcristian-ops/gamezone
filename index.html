<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameZone - Corrientes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050a1e;color:white}
header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:1px solid #1a2a5e;background:#080e26;position:sticky;top:0;z-index:10}
.logo{font-size:28px;font-weight:800}.logo span{color:#3a86ff}
.search{flex:1;max-width:500px;background:#111a3a;border-radius:30px;padding:10px 18px;display:flex}
.search input{background:transparent;border:none;outline:none;color:white;width:100%}
.promos{max-width:1250px;margin:20px auto;background:linear-gradient(90deg,#2a4bff,#7a2bff);border-radius:20px;padding:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.promo-item{background:rgba(0,0,0,.25);padding:12px 20px;border-radius:12px;text-align:center;min-width:140px}.promo-item b{font-size:18px;display:block}
.filtros{max-width:1250px;margin:auto;padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap}
.filtros button{background:#131e44;border:1px solid #24356f;color:#8da0d0;padding:8px 16px;border-radius:30px;cursor:pointer;font-weight:700}
.filtros button.activo{background:#2a5cff;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;max-width:1250px;margin:auto;padding:20px}
.card{background:linear-gradient(180deg,#122052,#0b1433);border:1px solid #1d2f6b;border-radius:18px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 25px rgba(42,92,255,.3)}
.card-img{height:250px;position:relative;background:#080e26}.card-img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800}
.b-PS2{background:#00c2ff;color:#000}.b-PS3{background:#0047ff}.b-SWITCH{background:#ff0033}
.card-body{padding:10px}.card-title{font-size:14px;font-weight:800;min-height:34px}.price{color:#6aff9a;font-weight:800;margin-top:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:100;padding:20px;overflow:auto}
.modal-box{max-width:900px;margin:30px auto;background:#0c1535;border:1px solid #24356f;border-radius:20px;overflow:hidden;display:flex;flex-wrap:wrap}
.modal-img{flex:1;min-width:280px}.modal-img img{width:100%;height:100%;object-fit:cover;min-height:450px}
.modal-info{flex:1.2;min-width:280px;padding:20px}
.video{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin:12px 0}.video iframe{width:100%;height:100%;border:none}
.btn-wa{background:#25D366;color:#000;border:none;padding:13px;width:100%;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<header>
<div class="logo">🎮 Game<span>Zone</span></div>
<div class="search">🔍 <input id="buscador" placeholder="Buscar juegos..."></div>
<div style="font-size:12px">📍 Corrientes | 3795-118415</div>
</header>

<div class="promos">
<div><h2>🔥 PROMOS</h2><p>Llevate más y pagá menos</p></div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<div class="promo-item"><b>3 x $3.500</b>PS2</div>
<div class="promo-item"><b>3 x $4.500</b>PS3</div>
<div class="promo-item"><b>2 x $5.500</b>Switch</div>
</div>
</div>

<div class="filtros">
<button class="activo" onclick="filtrar('todos',this)">Todos</button>
<button onclick="filtrar('PS2',this)">PS2</button>
<button onclick="filtrar('PS3',this)">PS3</button>
<button onclick="filtrar('SWITCH',this)">Switch</button>
<button onclick="filtrar('OFERTA',this)">🔥 Ofertas</button>
</div>

<div class="grid" id="grid"></div>

<div id="modal" onclick="if(event.target==this)cerrar()">
<div class="modal-box">
<div class="modal-img"><img id="m-img"></div>
<div class="modal-info">
<h2 id="m-title"></h2>
<p id="m-meta" style="color:#8da0d0;font-size:13px;margin:6px 0"></p>
<div class="video"><iframe id="m-video" allowfullscreen></iframe></div>
<p id="m-desc" style="line-height:1.5"></p>
<button class="btn-wa" id="m-wa">🟢 Consultar por WhatsApp - 3795-118415</button>
<button onclick="cerrar()" style="width:100%;margin-top:8px;background:#1a254d;color:white;border:none;padding:10px;border-radius:10px">Cerrar</button>
</div>
</div>
</div>

<script>
const WA="5493795118415";
const juegos=[
{n:"GTA San Andreas",cat:"PS2 OFERTA",p:"$1.200",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co2lbw.jpg",yt:"yOzcbtsMv50",desc:"El clásico absoluto de PS2. Mundo abierto enorme, historia de CJ en Los Santos, 100hs de juego. El más vendido.",meta:"PS2 • 2004 • Mundo Abierto"},
{n:"God of War II",cat:"PS2",p:"$2.500",img:"https://i.imgur.com/wP7k6lR.jpeg",yt:"d34oC7oZqQE",desc:"Kratos vs los Dioses del Olimpo. El mejor hack and slash de PS2 con final épico.",meta:"PS2 • 2007 • Acción Exclusivo"},
{n:"Shadow of the Colossus",cat:"PS2",p:"$2.200",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1rg1.jpg",yt:"pdZQ98AHz1g",desc:"Obra maestra. Solo vos, tu caballo y 16 colosos gigantes.",meta:"PS2 • 2005 • Aventura"},
{n:"Resident Evil 4",cat:"PS2",p:"$1.500",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1ur7.jpg",yt:"u90g8OdbNsc",desc:"Leon en pueblo infectado. Cambió el survival horror para siempre.",meta:"PS2 • 2005 • Horror"},
{n:"DBZ Budokai Tenkaichi 3",cat:"PS2 OFERTA",p:"$1.500",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1x7h.jpg",yt:"t3T0Cj_5s8Q",desc:"161 personajes, combates 3D ultra rápidos. El mejor DBZ.",meta:"PS2 • 2007 • Pelea"},
{n:"Grand Theft Auto V",cat:"PS3 OFERTA",p:"$1.500",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co2lbw.jpg",yt:"QkkoHAzjnUs",desc:"Los Santos en HD. 3 protagonistas, atracos, online.",meta:"PS3 • 2013 • Mundo Abierto"},
{n:"The Last of Us",cat:"PS3",p:"$2.000",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1ur4.jpg",yt:"W2Wnvvj33Wo",desc:"Joel y Ellie post-apocalíptico. La mejor historia de PS3.",meta:"PS3 • 2013 • Exclusivo"},
{n:"Red Dead Redemption",cat:"PS3",p:"$1.800",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1ur5.jpg",yt:"-o7r0M2hT8c",desc:"John Marston en el viejo oeste. Mundo abierto y historia brutal.",meta:"PS3 • 2010 • Western"},
{n:"Uncharted 2",cat:"PS3",p:"$1.500",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1z2d.jpg",yt:"I9a5g2gQy4E",desc:"Nathan Drake en Nepal. Acción cinematográfica.",meta:"PS3 • 2009 • Aventura"},
{n:"God of War III",cat:"PS3",p:"$2.200",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1t4y.jpg",yt:"K0u_kAWLJOA",desc:"Kratos destruye el Olimpo. Jefes colosales.",meta:"PS3 • 2010 • Exclusivo"},
{n:"Zelda Breath of the Wild",cat:"SWITCH",p:"$6.500",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co3p2d.jpg",yt:"1rP1skW7Zc4",desc:"Mundo abierto total. 100 santuarios, 100hs+. El mejor Zelda.",meta:"Switch • 2017 • Exclusivo"},
{n:"Mario Odyssey",cat:"SWITCH OFERTA",p:"$5.500",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1t7w.jpg",yt:"wGQ9KmwsQ1k",desc:"Mario y Cappy viajando por el mundo. 999 lunas.",meta:"Switch • 2017 • Plataformas"},
{n:"Mario Kart 8 Deluxe",cat:"SWITCH OFERTA",p:"$5.000",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1te2.jpg",yt:"tKlRN2Y_8z8",desc:"48 pistas, 4 jugadores en misma consola, online.",meta:"Switch • 2017 • Carreras"},
{n:"Smash Bros Ultimate",cat:"SWITCH",p:"$5.800",img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1vuk.jpg",yt:"WShCN-AYHqA",desc:"80 peleadores. El crossover más grande.",meta:"Switch • 2018 • Pelea"},
];

function render(lista){
let g=document.getElementById('grid'); g.innerHTML="";
lista.forEach((j,i)=>{
let plat=j.cat.includes('PS2')?'PS2':j.cat.includes('PS3')?'PS3':'SWITCH';
g.innerHTML+=`<div class="card" onclick="abrir(${i})"><div class="card-img"><img src="${j.img}"><span class="badge b-${plat}">${plat}</span></div><div class="card-body"><div class="card-title">${j.n}</div><div class="price">${j.p}</div></div></div>`
});
}
render(juegos);
function filtrar(c,b){
document.querySelectorAll('.filtros button').forEach(x=>x.classList.remove('activo'));b.classList.add('activo');
if(c=='todos')render(juegos);else render(juegos.filter(j=>j.cat.includes(c)));
}
document.getElementById('buscador').addEventListener('input',e=>{render(juegos.filter(j=>j.n.toLowerCase().includes(e.target.value.toLowerCase())))});
function abrir(i){let j=juegos[i];document.getElementById('m-img').src=j.img;document.getElementById('m-title').innerText=j.n;document.getElementById('m-meta').innerText=j.meta;document.getElementById('m-desc').innerText=j.desc;document.getElementById('m-video').src="https://www.youtube.com/embed/"+j.yt;document.getElementById('m-wa').onclick=()=>{window.open("https://wa.me/"+WA+"?text=Hola GameZone! Quiero consultar por "+encodeURIComponent(j.n)+" "+j.p)};document.getElementById('modal').style.display='block'}
function cerrar(){document.getElementById('modal').style.display='none';document.getElementById('m-video').src=''}
</script>
</body>
</html>
