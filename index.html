<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameZone Corrientes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050a1e;color:#fff}
header{background:#0c1535;padding:12px;text-align:center;border-bottom:3px solid #2a5cff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;max-width:800px;margin:auto}
.card{background:#121f44;border-radius:12px;overflow:hidden;border:1px solid #24357a}
.card img{width:100%;height:190px;object-fit:cover;background:#000}
.card-body{padding:8px}
.price{color:#6aff9a;font-weight:800}
.btn{display:block;text-align:center;padding:9px;border-radius:8px;text-decoration:none;font-weight:800;margin-top:6px;font-size:13px}
.ver{background:#2a5cff;color:#fff;cursor:pointer}
.wa{background:#25D366;color:#000}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:99;padding:12px;overflow:auto}
.box{max-width:500px;margin:10px auto;background:#0c1535;border-radius:12px;overflow:hidden}
.box img{width:100%;height:260px;object-fit:cover}
.info{padding:12px}
</style>
</head>
<body>
<header><h1>🎮 GameZone Corrientes</h1><p>3795-118415 - Video fix liviano</p></header>
<div class="grid" id="g"></div>

<div id="modal" onclick="if(event.target==this)cerrar()"><div class="box">
<img id="mImg"><div class="info">
<h2 id="mTit"></h2>
<p id="mDesc" style="color:#cbd5ff;margin:8px 0;white-space:pre-line;line-height:1.4;font-size:14px"></p>
<div id="videoBox" style="margin-top:10px"></div>
<a id="mWa" class="btn wa" target="_blank" style="padding:13px;margin-top:10px">🟢 WhatsApp</a>
<button onclick="cerrar()" style="width:100%;margin-top:8px;padding:10px;background:#1a254d;color:#fff;border:0;border-radius:10px">Cerrar</button>
</div></div></div>

<script>
const JUEGOS=[{
t:"GTA San Andreas PS2",
p:"$1.200",
img:"https://images.weserv.nl/?url=i.postimg.cc/zfpsmzqk/grand-theft-auto-gta-san-andreas-sony-playstation-2-ps2-710425274107-cover-art.jpg&w=400&output=webp",
yt:"3xu_jxcTvfo",
desc:"🔥 GTA SAN ANDREAS - PS2 CLASICO 🔥\n\n✔ Mundo abierto: Los Santos / San Fierro / Las Venturas\n✔ 100 misiones + secundarias, gym, tunear autos\n✔ 1 jugador, 100hs de juego\n✔ Funciona en PS2 flasheada con pendrive\n✔ Entrega inmediata en Corrientes"
}];

document.getElementById("g").innerHTML=JUEGOS.map((j,i)=>`
<div class="card">
<img src="${j.img}" loading="lazy">
<div class="card-body">
<h3 style="font-size:13px">${j.t}</h3>
<div class="price">${j.p}</div>
<a class="btn ver" onclick="ver(${i})">👁️ Ver + Video</a>
<a class="btn wa" href="https://wa.me/5493795118415?text=Hola quiero ${encodeURIComponent(j.t)}" target="_blank">WhatsApp</a>
</div></div>`).join("");

function ver(i){
let j=JUEGOS[i];
document.getElementById('mImg').src=j.img;
document.getElementById('mTit').innerText=j.t+" "+j.p;
document.getElementById('mDesc').innerText=j.desc;
document.getElementById('videoBox').innerHTML=`<iframe width="100%" height="220" src="https://www.youtube-nocookie.com/embed/${j.yt}?rel=0" frameborder="0" allowfullscreen style="border-radius:10px;background:#000"></iframe>`;
document.getElementById('mWa').href=`https://wa.me/5493795118415?text=Hola GameZone! Quiero ${encodeURIComponent(j.t)} ${j.p}`;
document.getElementById('modal').style.display='block';
}
function cerrar(){document.getElementById('modal').style.display='none';document.getElementById('videoBox').innerHTML='';}
</script>
</body>
</html>
