<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameZone Corrientes</title>
<link rel="stylesheet" href="style.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
<header class="header"><div class="container header-content"><a class="logo">🎮 Game<span>Zone</span></a><button class="cart-button" id="cartButton">🛒 <strong id="cartCount">0</strong></button></div></header>

<section class="console-selector">
  <div class="container">
    <h1>Elegí tu consola</h1>
    <div class="console-bubbles">
      <button class="console-bubble active" data-console="ps2"><span class="bubble-content"><strong>PS2</strong><small>120 JUEGOS</small></span></button>
      <button class="console-bubble" data-console="ps4"><span class="bubble-content"><strong>PS4</strong><small>CATÁLOGO</small></span></button>
      <button class="console-bubble" data-console="ps5"><span class="bubble-content"><strong>PS5</strong><small>CATÁLOGO</small></span></button>
      <button class="console-bubble" data-console="switch"><span class="bubble-content"><strong>SWITCH</strong><small>PRÓXIMAMENTE</small></span></button>
    </div>
  </div>
</section>

<section class="products-section" id="juegos">
  <div class="container">
    <div class="section-heading">
      <div><span class="section-label" id="catalogLabel">CATÁLOGO PS2</span><h2 id="catalogTitle">Juegos PS2</h2></div>
      <div class="search-box"><input type="search" id="searchInput" placeholder="Buscar en PS2..."><button id="searchButton">🔍</button></div>
    </div>
    <div class="products-grid" id="productsGrid"></div>
    <div class="platform-coming" id="platformComing" hidden></div>
    <div class="pagination" id="pagination"></div>
  </div>
</section>

<aside class="cart-panel" id="cartPanel"><div class="cart-header"><h2>Tu lista</h2><button id="closeCartButton">×</button></div><div id="cartItems"></div><div id="cartEmpty">Vacío</div><div class="cart-footer"><span id="cartTotal">0 juegos</span><button id="checkoutButton" class="checkout-button">Consultar WhatsApp</button></div></aside>
<div class="overlay" id="overlay" hidden></div>
<a href="https://wa.me/TU_NUMERO_AQUI" class="whatsapp-float" target="_blank">💬</a>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init();</script>
<script src="script.js"></script>
</body>
</html>
